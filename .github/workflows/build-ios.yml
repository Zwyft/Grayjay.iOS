name: Build iOS IPA

on:
  push:
    branches:
      - ios-port
  pull_request:
    branches:
      - ios-port
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install xcodegen
          brew install ldid

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App (Unsigned for Jailbreak)
        run: |
          xcodebuild -project GrayjayiOS.xcodeproj \
            -scheme GrayjayiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Pseudo-Sign App (ldid)
        run: |
          cat <<EOF > entitlements.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>com.futo.GrayjayiOS</string>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF
          ldid -Sentitlements.xml build/Build/Products/Release-iphoneos/GrayjayiOS.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/GrayjayiOS.app Payload/
          zip -r Grayjay-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grayjay-iOS-IPA
          path: Grayjay-iOS.ipa
